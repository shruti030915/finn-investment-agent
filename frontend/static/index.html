<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>FINN — Financial Investment Intelligence Agent | ENAM Holdings</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            finn: {
              bg: '#080C14',
              surface: '#0E1524',
              card: '#141E33',
              cardHover: '#1B2844',
              border: '#1F2E4D',
              borderLight: '#2D4168',
              accent: '#38BDF8',
              accentGlow: 'rgba(56, 189, 248, 0.15)',
              gold: '#F59E0B',
              gain: '#10B981',
              gainBg: 'rgba(16, 185, 129, 0.12)',
              loss: '#EF4444',
              lossBg: 'rgba(239, 68, 68, 0.12)',
              textMuted: '#8A99AD',
              textSub: '#A8B7CD'
            }
          },
          fontFamily: {
            mono: ['JetBrains Mono', 'Menlo', 'Consolas', 'monospace'],
            sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'sans-serif']
          }
        }
      }
    }
  </script>

  <!-- React 18 & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel Standalone for JSX compilation -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    /* Custom Bloomberg-style scrollbar and terminal feel */
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: #080C14; }
    ::-webkit-scrollbar-thumb { background: #1F2E4D; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #38BDF8; }
    body {
      background-color: #080C14;
      color: #F1F5F9;
      font-feature-settings: "cv02", "cv03", "cv04", "cv11";
      -webkit-font-smoothing: antialiased;
      user-select: none;
    }
    .ticker-tape {
      display: flex;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .ticker-tape::-webkit-scrollbar { display: none; }
    .terminal-glow {
      box-shadow: 0 0 25px rgba(56, 189, 248, 0.08);
    }
  </style>
</head>
<body class="bg-finn-bg text-slate-100 min-h-screen">
  <div id="root"></div>

  <!-- Main React Application -->
  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    // --- ICON SVGS ---
    const Icon = ({ name, className = "w-5 h-5", ...props }) => {
      switch (name) {
        case 'trending-up':
          return <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" {...props}><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"/></svg>;
        case 'trending-down':
          return <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" {...props}><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M13 17h8m0 0V9m0 8l-8-8-4 4-6-6"/></svg>;
        case 'bell':
          return <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" {...props}><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/></svg>;
        case 'search':
          return <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" {...props}><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>;
        case 'sliders':
          return <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" {...props}><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4"/></svg>;
        case 'home':
          return <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" {...props}><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>;
        case 'file-text':
          return <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" {...props}><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>;
        case 'shield-alert':
          return <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" {...props}><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>;
        case 'external-link':
          return <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" {...props}><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/></svg>;
        case 'check':
          return <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" {...props}><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5 13l4 4L19 7"/></svg>;
        case 'activity':
          return <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" {...props}><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>;
        default:
          return <div className={className} />;
      }
    };

    // --- API CLIENT ---
    const API = {
      getStatus: () => fetch('/api/status').then(r => r.json()),
      getPortfolio: () => fetch('/api/portfolio').then(r => r.json()),
      getStock: (ticker) => fetch(`/api/stocks/${ticker}`).then(r => r.json()),
      getAnnouncements: (params = {}) => {
        const query = new URLSearchParams(params).toString();
        return fetch(`/api/announcements?${query}`).then(r => r.json());
      },
      getAlerts: () => fetch('/api/alerts').then(r => r.json()),
      acknowledgeAlert: (id) => fetch(`/api/alerts/acknowledge/${id}`, { method: 'POST' }).then(r => r.json()),
      getAlertSettings: () => fetch('/api/alerts/settings').then(r => r.json()),
      updateAlertSettings: (settings) => fetch('/api/alerts/settings', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(settings)
      }).then(r => r.json()),
      getDigest: (windowHours = 24) => fetch(`/api/digest?window_hours=${windowHours}`).then(r => r.json()),
      runResearch: (ticker, query) => fetch('/api/research/query', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ ticker, query })
      }).then(r => r.json()),
      getDocuments: (ticker) => fetch(`/api/research/documents/${ticker}`).then(r => r.json()),
      getPageText: (docId, pageNum) => fetch(`/api/research/document/${docId}/page/${pageNum}`).then(r => r.json())
    };

    // --- MAIN APP COMPONENT ---
    function App() {
      const [currentTab, setCurrentTab] = useState('home'); // 'home' | 'alerts' | 'research' | 'settings'
      const [portfolio, setPortfolio] = useState(null);
      const [alerts, setAlerts] = useState([]);
      const [announcements, setAnnouncements] = useState([]);
      const [digest, setDigest] = useState(null);
      const [digestWindow, setDigestWindow] = useState(24);
      const [systemStatus, setSystemStatus] = useState(null);
      const [loading, setLoading] = useState(true);

      // Research State
      const [researchTicker, setResearchTicker] = useState('TCS');
      const [researchQuery, setResearchQuery] = useState('Analyze financial trajectory, guidance vs actuals, and bull vs bear case');
      const [researchResult, setResearchResult] = useState(null);
      const [researchLoading, setResearchLoading] = useState(false);

      // Source Inspection Modal State
      const [sourceModal, setSourceModal] = useState({ open: false, docId: '', pageNum: 1, text: '', title: '' });

      // Settings State
      const [alertSettings, setAlertSettings] = useState({
        price_move_threshold: 3.0,
        volume_mult_threshold: 2.0,
        digest_window_hours: 24,
        monitored_categories: []
      });

      // Fetch initial data
      const refreshData = async () => {
        try {
          const [portData, alertData, annData, digData, statData, settData] = await Promise.all([
            API.getPortfolio(),
            API.getAlerts(),
            API.getAnnouncements({ window_hours: digestWindow }),
            API.getDigest(digestWindow),
            API.getStatus(),
            API.getAlertSettings()
          ]);
          setPortfolio(portData);
          setAlerts(alertData);
          setAnnouncements(annData);
          setDigest(digData);
          setSystemStatus(statData);
          setAlertSettings(settData);
        } catch (e) {
          console.error("Data fetch failed", e);
        } finally {
          setLoading(false);
        }
      };

      useEffect(() => {
        refreshData();
      }, [digestWindow]);

      // Automatically run default research for demo
      useEffect(() => {
        if (!researchResult && !researchLoading) {
          handleExecuteResearch('TCS', 'Analyze financial trajectory, guidance vs actuals, and bull vs bear case');
        }
      }, []);

      const handleExecuteResearch = async (ticker, query) => {
        setResearchLoading(true);
        setResearchTicker(ticker);
        try {
          const res = await API.runResearch(ticker, query || researchQuery);
          setResearchResult(res);
        } catch (e) {
          console.error("Research failed", e);
        } finally {
          setResearchLoading(false);
        }
      };

      const handleAcknowledgeAlert = async (alertId) => {
        await API.acknowledgeAlert(alertId);
        setAlerts(prev => prev.map(a => a.id === alertId ? { ...a, acknowledged: true } : a));
      };

      const openCitation = async (docId, pageNum, title) => {
        try {
          const pageData = await API.getPageText(docId, pageNum);
          setSourceModal({
            open: true,
            docId,
            pageNum,
            title: title || docId,
            text: pageData.text
          });
        } catch (e) {
          alert(`Could not load primary page ${pageNum} for ${docId}`);
        }
      };

      const unacknowledgedAlertCount = useMemo(() => {
        return alerts.filter(a => !a.acknowledged).length;
      }, [alerts]);

      return (
        <div className="flex flex-col min-h-screen pb-20 md:pb-6">
          {/* TOP BAR / BRAND HEADER */}
          <header className="sticky top-0 z-40 bg-finn-surface/90 backdrop-blur-md border-b border-finn-border px-4 py-2.5 flex items-center justify-between">
            <div className="flex items-center space-x-3">
              <div className="flex items-center space-x-2">
                <div className="w-8 h-8 rounded bg-gradient-to-br from-finn-accent to-indigo-600 flex items-center justify-center font-mono font-bold text-slate-900 text-sm shadow-lg shadow-finn-accent/20">
                  FN
                </div>
                <div>
                  <div className="flex items-center space-x-2">
                    <span className="font-mono font-extrabold text-sm tracking-wider text-slate-100">FINN</span>
                    <span className="text-[10px] font-mono px-1.5 py-0.5 rounded bg-sky-500/10 text-sky-400 border border-sky-500/30">
                      ENAM INTELLIGENCE
                    </span>
                    <span className="text-[10px] font-mono px-1.5 py-0.5 rounded bg-amber-500/10 text-amber-300 border border-amber-500/30 font-bold hidden sm:inline-block">
                      DEMO FEED & SIMULATED HOLDINGS
                    </span>
                    <span className="text-[10px] font-mono px-1.5 py-0.5 rounded bg-slate-800 text-slate-300 border border-slate-700 font-semibold hidden md:inline-block">
                      EOD Close: Oct 31, 2024 (Historical)
                    </span>
                  </div>
                  <div className="text-[10px] text-finn-textMuted tracking-tight hidden sm:block">
                    Push / Pull Financial Intelligence Terminal
                  </div>
                </div>
              </div>
            </div>

            {/* Top Right Quick Stats & Model Badge */}
            <div className="flex items-center space-x-3">
              <div className="hidden lg:flex items-center space-x-2 text-[11px] font-mono bg-finn-card px-2.5 py-1 rounded border border-finn-border">
                <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                <span className="text-finn-textSub">GROUNDING:</span>
                <span className="text-slate-200">PyMuPDF PRIMARY RAG</span>
              </div>

              {portfolio && (
                <div className="text-right">
                  <div className="text-[10px] uppercase font-mono text-finn-textMuted">Portfolio NAV</div>
                  <div className="text-xs sm:text-sm font-mono font-bold text-slate-100">
                    INR {(portfolio.total_value_inr / 100000).toFixed(2)}L
                    <span className={`ml-1.5 text-[11px] ${portfolio.day_change_pct >= 0 ? 'text-finn-gain' : 'text-finn-loss'}`}>
                      {portfolio.day_change_pct >= 0 ? '+' : ''}{portfolio.day_change_pct.toFixed(2)}%
                    </span>
                  </div>
                </div>
              )}
            </div>
          </header>

          {/* REAL-TIME TICKER TAPE */}
          {portfolio && (
            <div className="bg-finn-bg border-b border-finn-border py-1.5 px-2 overflow-hidden ticker-tape text-[11px] font-mono">
              <div className="flex space-x-4 whitespace-nowrap animate-none">
                {portfolio.stocks.map(s => (
                  <button
                    key={s.ticker}
                    onClick={() => {
                      setCurrentTab('research');
                      handleExecuteResearch(s.ticker, `Analyze recent financial trajectory and guidance execution`);
                    }}
                    className="flex items-center space-x-1.5 px-2 py-0.5 rounded bg-finn-card/60 hover:bg-finn-card border border-finn-border/60 hover:border-finn-accent/50 transition-colors"
                  >
                    <span className="font-semibold text-slate-200">{s.ticker}</span>
                    <span className="text-slate-400">₹{s.price.toFixed(1)}</span>
                    <span className={s.change_pct >= 0 ? 'text-finn-gain font-medium' : 'text-finn-loss font-medium'}>
                      {s.change_pct >= 0 ? '+' : ''}{s.change_pct.toFixed(1)}%
                    </span>
                    {s.volume_multiple >= 2.0 && (
                      <span className="px-1 py-0.2 text-[9px] rounded bg-amber-500/20 text-amber-300 font-mono">
                        {s.volume_multiple}x Vol
                      </span>
                    )}
                  </button>
                ))}
              </div>
            </div>
          )}

          {/* MAIN CONTENT AREA */}
          <main className="flex-1 max-w-7xl w-full mx-auto p-3 sm:p-4 md:p-6">
            {loading ? (
              <div className="flex flex-col items-center justify-center h-64 space-y-3">
                <div className="w-8 h-8 border-2 border-finn-accent border-t-transparent rounded-full animate-spin"></div>
                <div className="text-xs font-mono text-finn-textMuted tracking-wider">INITIALIZING FINN ENGINE...</div>
              </div>
            ) : (
              <>
                {currentTab === 'home' && (
                  <HomeView
                    portfolio={portfolio}
                    digest={digest}
                    alerts={alerts}
                    announcements={announcements}
                    digestWindow={digestWindow}
                    setDigestWindow={setDigestWindow}
                    onOpenResearch={(ticker) => {
                      setCurrentTab('research');
                      handleExecuteResearch(ticker, 'Full institutional analysis with narrative vs numbers');
                    }}
                    onOpenCitation={openCitation}
                    onAcknowledgeAlert={handleAcknowledgeAlert}
                  />
                )}

                {currentTab === 'alerts' && (
                  <AlertsView
                    alerts={alerts}
                    alertSettings={alertSettings}
                    setAlertSettings={setAlertSettings}
                    onAcknowledge={handleAcknowledgeAlert}
                    onOpenResearch={(ticker) => {
                      setCurrentTab('research');
                      handleExecuteResearch(ticker, 'Explain drivers behind recent price/volume alert');
                    }}
                    onRefresh={refreshData}
                  />
                )}

                {currentTab === 'research' && (
                  <ResearchView
                    ticker={researchTicker}
                    setTicker={setResearchTicker}
                    query={researchQuery}
                    setQuery={setResearchQuery}
                    result={researchResult}
                    loading={researchLoading}
                    onExecute={handleExecuteResearch}
                    onOpenCitation={openCitation}
                    portfolioStocks={portfolio ? portfolio.stocks : []}
                  />
                )}

                {currentTab === 'settings' && (
                  <SettingsView
                    alertSettings={alertSettings}
                    setAlertSettings={setAlertSettings}
                    portfolio={portfolio}
                    systemStatus={systemStatus}
                    onRefresh={refreshData}
                  />
                )}
              </>
            )}
          </main>

          {/* MOBILE-FIRST BOTTOM NAVIGATION DOCK */}
          <nav className="fixed bottom-0 left-0 right-0 z-40 bg-finn-surface/95 backdrop-blur-lg border-t border-finn-border flex items-center justify-around py-2 px-3 md:hidden">
            <button
              onClick={() => setCurrentTab('home')}
              className={`flex flex-col items-center space-y-0.5 text-xs ${currentTab === 'home' ? 'text-finn-accent' : 'text-finn-textMuted'}`}
            >
              <Icon name="home" className="w-5 h-5" />
              <span className="text-[10px] font-mono">HOME</span>
            </button>

            <button
              onClick={() => setCurrentTab('alerts')}
              className={`relative flex flex-col items-center space-y-0.5 text-xs ${currentTab === 'alerts' ? 'text-finn-accent' : 'text-finn-textMuted'}`}
            >
              <Icon name="bell" className="w-5 h-5" />
              {unacknowledgedAlertCount > 0 && (
                <span className="absolute -top-1 -right-1 px-1.5 py-0.2 rounded-full bg-red-500 text-[9px] font-bold text-white">
                  {unacknowledgedAlertCount}
                </span>
              )}
              <span className="text-[10px] font-mono">ALERTS</span>
            </button>

            <button
              onClick={() => setCurrentTab('research')}
              className={`flex flex-col items-center space-y-0.5 text-xs ${currentTab === 'research' ? 'text-finn-accent' : 'text-finn-textMuted'}`}
            >
              <Icon name="search" className="w-5 h-5" />
              <span className="text-[10px] font-mono">PULL RAG</span>
            </button>

            <button
              onClick={() => setCurrentTab('settings')}
              className={`flex flex-col items-center space-y-0.5 text-xs ${currentTab === 'settings' ? 'text-finn-accent' : 'text-finn-textMuted'}`}
            >
              <Icon name="sliders" className="w-5 h-5" />
              <span className="text-[10px] font-mono">CONFIG</span>
            </button>
          </nav>

          {/* DESKTOP FLOATING TAB SELECTOR */}
          <div className="hidden md:flex fixed bottom-5 left-1/2 -translate-x-1/2 z-40 bg-finn-surface/90 backdrop-blur-md border border-finn-border rounded-full p-1 shadow-2xl space-x-1">
            <button
              onClick={() => setCurrentTab('home')}
              className={`px-4 py-1.5 rounded-full text-xs font-mono font-medium flex items-center space-x-2 transition-all ${
                currentTab === 'home' ? 'bg-finn-accent text-slate-900 font-bold shadow-md shadow-finn-accent/30' : 'text-finn-textSub hover:text-white'
              }`}
            >
              <Icon name="home" className="w-4 h-4" />
              <span>HOME</span>
            </button>

            <button
              onClick={() => setCurrentTab('alerts')}
              className={`relative px-4 py-1.5 rounded-full text-xs font-mono font-medium flex items-center space-x-2 transition-all ${
                currentTab === 'alerts' ? 'bg-finn-accent text-slate-900 font-bold shadow-md shadow-finn-accent/30' : 'text-finn-textSub hover:text-white'
              }`}
            >
              <Icon name="bell" className="w-4 h-4" />
              <span>ALERTS</span>
              {unacknowledgedAlertCount > 0 && (
                <span className="px-1.5 py-0.2 rounded-full bg-red-500 text-[10px] font-bold text-white">
                  {unacknowledgedAlertCount}
                </span>
              )}
            </button>

            <button
              onClick={() => setCurrentTab('research')}
              className={`px-4 py-1.5 rounded-full text-xs font-mono font-medium flex items-center space-x-2 transition-all ${
                currentTab === 'research' ? 'bg-finn-accent text-slate-900 font-bold shadow-md shadow-finn-accent/30' : 'text-finn-textSub hover:text-white'
              }`}
            >
              <Icon name="search" className="w-4 h-4" />
              <span>PULL RESEARCH (RAG)</span>
            </button>

            <button
              onClick={() => setCurrentTab('settings')}
              className={`px-4 py-1.5 rounded-full text-xs font-mono font-medium flex items-center space-x-2 transition-all ${
                currentTab === 'settings' ? 'bg-finn-accent text-slate-900 font-bold shadow-md shadow-finn-accent/30' : 'text-finn-textSub hover:text-white'
              }`}
            >
              <Icon name="sliders" className="w-4 h-4" />
              <span>SETTINGS</span>
            </button>
          </div>

          {/* PRIMARY SOURCE CITATION INSPECTOR MODAL */}
          {sourceModal.open && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm animate-fade-in">
              <div className="bg-finn-surface border border-finn-border rounded-xl max-w-2xl w-full max-h-[85vh] flex flex-col shadow-2xl overflow-hidden">
                <div className="p-4 border-b border-finn-border flex items-center justify-between bg-finn-card">
                  <div>
                    <div className="text-[10px] font-mono uppercase tracking-wider text-finn-accent">
                      Primary Filing Inspector • Grounded Evidence
                    </div>
                    <div className="text-sm font-bold text-slate-100 flex items-center space-x-2">
                      <Icon name="file-text" className="w-4 h-4 text-sky-400" />
                      <span>{sourceModal.title}</span>
                      <span className="px-2 py-0.5 rounded text-[10px] font-mono bg-finn-surface border border-finn-border text-amber-300">
                        Page {sourceModal.pageNum}
                      </span>
                    </div>
                  </div>
                  <button
                    onClick={() => setSourceModal({ ...sourceModal, open: false })}
                    className="p-1 rounded hover:bg-slate-800 text-slate-400 hover:text-white"
                  >
                    ✕
                  </button>
                </div>
                <div className="p-4 overflow-y-auto flex-1 font-mono text-xs text-slate-300 leading-relaxed whitespace-pre-wrap bg-finn-bg/90">
                  {sourceModal.text}
                </div>
                <div className="p-3 border-t border-finn-border bg-finn-card flex items-center justify-between text-[11px] font-mono text-finn-textMuted">
                  <span>Source: SEC/NSE Audited Regulatory Repository</span>
                  <span className="text-emerald-400">Strictly Non-Hallucinated Verification</span>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    // --- VIEW 1: HOME VIEW (PUSH DASHBOARD & DIGEST) ---

    function ResearchView({ ticker, setTicker, query, setQuery, result, loading, onExecute, onOpenCitation, portfolioStocks }) {
      const [uploadStatus, setUploadStatus] = useState('');
      const fileInputRef = useRef(null);

      const presetQueries = [
        "Analyze financial trajectory, guidance vs actuals, and bull vs bear case",
        "Compare management guidance with actual performance (Narrative vs Numbers)",
        "Analyze balance sheet health, debt leverage, and cash conversion",
        "Provide institutional bull and bear cases with primary citations"
      ];

      const handleFileUpload = async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        setUploadStatus('Indexing PDF via PyMuPDF...');
        try {
          const resp = await fetch(`/api/research/upload?filename=${encodeURIComponent(file.name)}&ticker=${encodeURIComponent(ticker)}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/pdf' },
            body: file
          }).then(r => r.json());
          setUploadStatus(`Indexed: ${resp.doc_id}`);
          setTimeout(() => setUploadStatus(''), 4000);
          onExecute(ticker, query);
        } catch (err) {
          setUploadStatus('Upload failed');
          setTimeout(() => setUploadStatus(''), 3000);
        }
      };

      return (
        <div className="space-y-5">
          {/* RESEARCH QUERY INPUT BAR */}
          <div className="bg-finn-card border border-finn-border rounded-xl p-4 terminal-glow">
            <div className="text-xs font-mono font-bold uppercase tracking-wider text-finn-accent mb-2 flex items-center justify-between">
              <span>Primary-Grounded RAG Research Engine</span>
              <span className="text-[10px] font-mono text-emerald-400 font-normal">
                Audited Filings Only • Zero Broker Noise
              </span>
            </div>

            <div className="grid grid-cols-1 sm:grid-cols-4 gap-2">
              <div className="sm:col-span-1">
                <input
                  type="text"
                  placeholder="NSE Ticker (e.g. TCS)"
                  value={ticker}
                  onChange={(e) => setTicker(e.target.value.toUpperCase())}
                  className="w-full bg-finn-surface border border-finn-border rounded px-3 py-2 text-xs font-mono text-slate-100 uppercase focus:border-finn-accent focus:outline-none"
                />
              </div>
              <div className="sm:col-span-3 flex space-x-2">
                <input
                  type="text"
                  placeholder="Enter institutional research question..."
                  value={query}
                  onChange={(e) => setQuery(e.target.value)}
                  className="flex-1 bg-finn-surface border border-finn-border rounded px-3 py-2 text-xs font-sans text-slate-100 focus:border-finn-accent focus:outline-none"
                />
                <button
                  onClick={() => onExecute(ticker, query)}
                  disabled={loading}
                  className="px-4 py-2 rounded bg-finn-accent text-slate-900 font-mono font-bold text-xs hover:bg-sky-400 disabled:opacity-50 transition-colors shrink-0"
                >
                  {loading ? 'Analyzing...' : 'Run Analysis'}
                </button>
              </div>
            </div>

            {/* Quick Preset Queries & Ticker Chips */}
            <div className="mt-3 flex flex-wrap items-center gap-1.5 text-[10px] font-mono">
              <span className="text-finn-textMuted mr-1">Quick Tickers:</span>
              {['TCS', 'RELIANCE', 'HDFCBANK', 'INFY', 'WIPRO', 'TITAN', 'ZOMATO'].map(t => (
                <button
                  key={t}
                  onClick={() => {
                    setTicker(t);
                    onExecute(t, query);
                  }}
                  className={`px-2 py-0.5 rounded border ${
                    ticker === t ? 'bg-finn-accent/20 border-finn-accent text-sky-300' : 'bg-finn-surface border-finn-border text-slate-400 hover:text-white'
                  }`}
                >
                  {t}
                </button>
              ))}
            </div>

            <div className="mt-2 flex flex-wrap items-center gap-1.5 text-[10px] font-sans">
              <span className="text-finn-textMuted font-mono mr-1">Presets:</span>
              {presetQueries.map((pq, idx) => (
                <button
                  key={idx}
                  onClick={() => {
                    setQuery(pq);
                    onExecute(ticker, pq);
                  }}
                  className="px-2 py-0.5 rounded bg-finn-surface border border-finn-border text-slate-300 hover:text-sky-300 text-[11px]"
                >
                  {idx === 0 ? "Comprehensive" : idx === 1 ? "Narrative vs Numbers" : idx === 2 ? "Balance Sheet" : "Bull vs Bear"}
                </button>
              ))}
            </div>

            {/* Primary Document Upload Bar */}
            <div className="mt-3 pt-3 border-t border-finn-border/60 flex flex-col sm:flex-row sm:items-center justify-between gap-2">
              <div className="flex items-center space-x-2">
                <input
                  type="file"
                  ref={fileInputRef}
                  accept=".pdf"
                  onChange={handleFileUpload}
                  className="hidden"
                />
                <button
                  onClick={() => fileInputRef.current?.click()}
                  className="px-2.5 py-1 rounded bg-finn-surface border border-finn-border hover:border-sky-400 text-sky-300 font-mono text-[11px] flex items-center space-x-1.5 transition-colors"
                >
                  <Icon name="file-text" className="w-3.5 h-3.5 text-sky-400" />
                  <span>+ Upload Primary PDF (Annual Report / Concall)</span>
                </button>
                {uploadStatus && <span className="text-emerald-400 font-mono text-[10px]">{uploadStatus}</span>}
              </div>
              <div className="text-[10px] font-mono text-finn-textMuted">
                PyMuPDF Page Parser & Chunker Ready
              </div>
            </div>
          </div>

          {/* RESEARCH OUTPUT DISPLAY */}
          {loading ? (
            <div className="bg-finn-card border border-finn-border rounded-xl p-8 text-center space-y-3">
              <div className="w-8 h-8 border-2 border-finn-accent border-t-transparent rounded-full animate-spin mx-auto"></div>
              <div className="text-xs font-mono text-slate-300">
                PARSING AUDITED FILINGS WITH PyMuPDF & RUNNING VECTOR RETRIEVAL...
              </div>
              <div className="text-[10px] font-mono text-finn-textMuted">
                Preserving page citations, comparing promises vs delivery
              </div>
            </div>
          ) : result ? (
            <div className="space-y-4">
              {/* Report Header */}
              <div className="bg-finn-surface border border-finn-border rounded-xl p-4 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                <div>
                  <div className="flex items-center space-x-2">
                    <span className="font-mono text-base font-bold text-slate-100">{result.company_name} ({result.ticker}.NS)</span>
                    {result.grounded_in_primary_sources ? (
                      <span className="px-2 py-0.5 rounded text-[10px] font-mono bg-emerald-500/10 text-emerald-400 border border-emerald-500/30">
                        Grounded in Primary Audited PDF
                      </span>
                    ) : (
                      <span className="px-2 py-0.5 rounded text-[10px] font-mono bg-amber-500/10 text-amber-300 border border-amber-500/30 font-bold">
                        Market Data Only • Primary PDF Missing
                      </span>
                    )}
                  </div>
                  <div className="text-xs text-finn-textMuted mt-0.5 font-mono">
                    Analysis Engine: {result.model_used} • Generated: {result.analyzed_at}
                  </div>
                </div>

                {/* Cited Sources Count */}
                <div className="flex items-center space-x-2">
                  <span className="text-xs font-mono text-slate-300">Cited Filings:</span>
                  <span className="px-2 py-0.5 rounded bg-finn-card text-sky-400 font-mono font-bold text-xs border border-finn-border">
                    {result.all_cited_sources.length} Documents
                  </span>
                </div>
              </div>

              {/* Missing Data Disclosures Banner */}
              {result.missing_data_disclosures && result.missing_data_disclosures.length > 0 && (
                <div className="bg-amber-950/20 border border-amber-500/30 rounded-lg p-3 text-xs text-amber-200 font-mono">
                  <div className="font-bold uppercase tracking-wider mb-0.5">Financial Disclosure Integrity Notice:</div>
                  {result.missing_data_disclosures.map((d, i) => (
                    <div key={i}>• {d}</div>
                  ))}
                </div>
              )}

              {/* 1. BUSINESS SNAPSHOT */}
              <div className="bg-finn-card border border-finn-border rounded-xl p-4">
                <div className="flex items-center justify-between border-b border-finn-border pb-2 mb-2">
                  <h3 className="text-xs font-mono font-bold uppercase tracking-wider text-slate-100 flex items-center space-x-2">
                    <span className="text-sky-400">1.</span>
                    <span>{result.business_snapshot.title}</span>
                  </h3>
                  <span className="text-[10px] font-mono px-1.5 py-0.2 rounded bg-finn-surface text-slate-400">
                    Confidence: {result.business_snapshot.confidence}
                  </span>
                </div>
                <p className="text-xs text-slate-200 leading-relaxed font-sans">{result.business_snapshot.content}</p>
              </div>

              {/* 2. FINANCIAL SNAPSHOT & KEY METRICS */}
              <div className="bg-finn-card border border-finn-border rounded-xl p-4">
                <div className="flex items-center justify-between border-b border-finn-border pb-2 mb-2">
                  <h3 className="text-xs font-mono font-bold uppercase tracking-wider text-slate-100 flex items-center space-x-2">
                    <span className="text-sky-400">2.</span>
                    <span>{result.financial_snapshot.title}</span>
                  </h3>
                  <span className="text-[10px] font-mono px-1.5 py-0.2 rounded bg-finn-surface text-slate-400">
                    Confidence: {result.financial_snapshot.confidence}
                  </span>
                </div>
                <p className="text-xs text-slate-200 leading-relaxed font-sans">{result.financial_snapshot.content}</p>

                {result.financial_snapshot.key_metrics && (
                  <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-6 gap-2 mt-3 pt-3 border-t border-finn-border">
                    {Object.entries(result.financial_snapshot.key_metrics).map(([k, v]) => (
                      <div key={k} className="bg-finn-surface rounded p-2 text-center border border-finn-border">
                        <div className="text-[9px] font-mono uppercase text-finn-textMuted">{k.replace(/_/g, ' ')}</div>
                        <div className="text-xs font-mono font-bold text-slate-100 mt-0.5">{v}</div>
                      </div>
                    ))}
                  </div>
                )}
              </div>

              {/* 3 & 4. TRAJECTORY AND BALANCE SHEET */}
              <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div className="bg-finn-card border border-finn-border rounded-xl p-4">
                  <div className="flex items-center justify-between border-b border-finn-border pb-2 mb-2">
                    <h3 className="text-xs font-mono font-bold uppercase tracking-wider text-slate-100 flex items-center space-x-2">
                      <span className="text-sky-400">3.</span>
                      <span>{result.financial_trajectory.title}</span>
                    </h3>
                  </div>
                  <p className="text-xs text-slate-200 leading-relaxed font-sans">{result.financial_trajectory.content}</p>
                </div>

                <div className="bg-finn-card border border-finn-border rounded-xl p-4">
                  <div className="flex items-center justify-between border-b border-finn-border pb-2 mb-2">
                    <h3 className="text-xs font-mono font-bold uppercase tracking-wider text-slate-100 flex items-center space-x-2">
                      <span className="text-sky-400">4.</span>
                      <span>{result.balance_sheet_leverage.title}</span>
                    </h3>
                  </div>
                  <p className="text-xs text-slate-200 leading-relaxed font-sans">{result.balance_sheet_leverage.content}</p>
                </div>
              </div>

              {/* 5. CASH QUALITY & CONVERSION */}
              <div className="bg-finn-card border border-finn-border rounded-xl p-4">
                <div className="flex items-center justify-between border-b border-finn-border pb-2 mb-2">
                  <h3 className="text-xs font-mono font-bold uppercase tracking-wider text-slate-100 flex items-center space-x-2">
                    <span className="text-sky-400">5.</span>
                    <span>{result.cash_quality_conversion.title}</span>
                  </h3>
                  <span className="text-[10px] font-mono px-1.5 py-0.2 rounded bg-emerald-500/10 text-emerald-400 border border-emerald-500/30">
                    High Cash Conversion
                  </span>
                </div>
                <p className="text-xs text-slate-200 leading-relaxed font-sans">{result.cash_quality_conversion.content}</p>
              </div>

              {/* 6. CRUCIAL SECTION: NARRATIVE VS NUMBERS (GUIDANCE VS DELIVERY) */}
              <div className="bg-gradient-to-br from-indigo-950/30 to-finn-card border-2 border-indigo-500/40 rounded-xl p-4 sm:p-5 terminal-glow">
                <div className="flex items-center justify-between border-b border-indigo-500/30 pb-2 mb-3">
                  <div>
                    <h3 className="text-xs sm:text-sm font-mono font-bold uppercase tracking-wider text-indigo-300 flex items-center space-x-2">
                      <span className="px-1.5 py-0.5 rounded bg-indigo-500 text-slate-900 font-bold">6</span>
                      <span>Narrative vs Numbers — Guidance vs Actual Delivery</span>
                    </h3>
                    <p className="text-[11px] text-slate-400 mt-0.5">
                      Evaluates what management promised over the last 4 quarters against what was delivered
                    </p>
                  </div>
                  <span className="text-[10px] font-mono px-2 py-0.5 rounded bg-indigo-500/20 text-indigo-300 border border-indigo-500/40">
                    CRITICAL ENAM CRITERIA
                  </span>
                </div>
                <div className="text-xs text-slate-100 leading-relaxed font-sans whitespace-pre-wrap">
                  {result.narrative_vs_numbers.content}
                </div>
              </div>

              {/* 7. BULL VS BEAR CASE */}
              <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div className="bg-emerald-950/20 border border-emerald-500/30 rounded-xl p-4">
                  <div className="flex items-center space-x-2 border-b border-emerald-500/20 pb-2 mb-2 text-emerald-400 font-mono text-xs font-bold uppercase tracking-wider">
                    <Icon name="trending-up" className="w-4 h-4" />
                    <span>Institutional Bull Thesis</span>
                  </div>
                  <div className="text-xs text-slate-200 leading-relaxed font-sans whitespace-pre-wrap">
                    {result.bull_case.content}
                  </div>
                </div>

                <div className="bg-rose-950/20 border border-rose-500/30 rounded-xl p-4">
                  <div className="flex items-center space-x-2 border-b border-rose-500/20 pb-2 mb-2 text-rose-400 font-mono text-xs font-bold uppercase tracking-wider">
                    <Icon name="trending-down" className="w-4 h-4" />
                    <span>Institutional Bear Thesis</span>
                  </div>
                  <div className="text-xs text-slate-200 leading-relaxed font-sans whitespace-pre-wrap">
                    {result.bear_case.content}
                  </div>
                </div>
              </div>

              {/* 8. PRIMARY SOURCE CITATIONS LIST */}
              <div className="bg-finn-card border border-finn-border rounded-xl p-4">
                <div className="flex items-center justify-between border-b border-finn-border pb-2 mb-3">
                  <h3 className="text-xs font-mono font-bold uppercase tracking-wider text-slate-100 flex items-center space-x-2">
                    <Icon name="file-text" className="w-4 h-4 text-sky-400" />
                    <span>Supporting Primary Documents & Exact Page Citations</span>
                  </h3>
                  <span className="text-[10px] font-mono text-finn-textMuted">Click to inspect original PDF text</span>
                </div>

                <div className="space-y-2">
                  {result.all_cited_sources.map((s, idx) => (
                    <div
                      key={idx}
                      onClick={() => onOpenCitation(s.doc_id, s.page_number, s.title)}
                      className="bg-finn-surface border border-finn-border rounded p-2.5 flex items-center justify-between hover:border-sky-400 cursor-pointer transition-colors"
                    >
                      <div className="flex items-center space-x-2.5 overflow-hidden">
                        <span className="text-[10px] font-mono text-finn-accent font-bold px-1.5 py-0.5 rounded bg-finn-card border border-finn-border shrink-0">
                          PAGE {s.page_number}
                        </span>
                        <div className="truncate">
                          <div className="text-xs font-semibold text-slate-200 truncate">{s.title}</div>
                          <div className="text-[10px] text-finn-textMuted truncate">"{s.snippet}"</div>
                        </div>
                      </div>
                      <div className="flex items-center space-x-2 shrink-0 ml-2">
                        <span className="text-[10px] font-mono text-slate-400">Score: {s.relevance_score}</span>
                        <Icon name="external-link" className="w-3.5 h-3.5 text-sky-400" />
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          ) : null}
        </div>
      );
    }

    // --- VIEW 4: SETTINGS VIEW ---
    function SettingsView({ alertSettings, setAlertSettings, portfolio, systemStatus, onRefresh }) {
      return (
        <div className="space-y-5 max-w-4xl mx-auto">
          <div>
            <h2 className="text-sm font-mono font-bold uppercase tracking-wider text-slate-100">
              System Settings & Architecture Diagnostics
            </h2>
            <p className="text-xs text-finn-textMuted mt-0.5">
              Portfolio allocations, alert sensitivity, RAG index health, and API integrations
            </p>
          </div>

          {/* STATUS CARDS */}
          {systemStatus && (
            <div className="bg-finn-card border border-finn-border rounded-xl p-4">
              <div className="text-xs font-mono font-bold uppercase tracking-wider text-finn-accent mb-3">
                FINN Engine Diagnostics
              </div>
              <div className="grid grid-cols-2 sm:grid-cols-4 gap-3 text-xs font-mono">
                <div className="bg-finn-surface p-2.5 rounded border border-finn-border">
                  <div className="text-[10px] text-finn-textMuted uppercase">Server Status</div>
                  <div className="text-emerald-400 font-bold mt-1">ONLINE (v1.0.0)</div>
                </div>
                <div className="bg-finn-surface p-2.5 rounded border border-finn-border">
                  <div className="text-[10px] text-finn-textMuted uppercase">Primary Documents</div>
                  <div className="text-slate-100 font-bold mt-1">{systemStatus.indexed_documents_count} PDFs</div>
                </div>
                <div className="bg-finn-surface p-2.5 rounded border border-finn-border">
                  <div className="text-[10px] text-finn-textMuted uppercase">Indexed Chunks</div>
                  <div className="text-slate-100 font-bold mt-1">{systemStatus.indexed_chunks_count} Chunks</div>
                </div>
                <div className="bg-finn-surface p-2.5 rounded border border-finn-border">
                  <div className="text-[10px] text-finn-textMuted uppercase">AI Architecture</div>
                  <div className="text-sky-300 font-bold mt-1 truncate">{systemStatus.llm_provider}</div>
                </div>
              </div>
            </div>
          )}

          {/* PORTFOLIO SECTOR ALLOCATION TABLE */}
          {portfolio && (
            <div className="bg-finn-card border border-finn-border rounded-xl p-4">
              <div className="text-xs font-mono font-bold uppercase tracking-wider text-slate-100 mb-3 flex items-center justify-between">
                <span>Active 18-Stock Mock Portfolio Roster</span>
                <span className="text-[10px] font-mono text-finn-textMuted">Diverse Multi-Sector Coverage</span>
              </div>

              <div className="overflow-x-auto">
                <table className="w-full text-left font-mono text-xs">
                  <thead className="bg-finn-surface text-[10px] text-finn-textMuted uppercase border-b border-finn-border">
                    <tr>
                      <th className="p-2">Ticker</th>
                      <th className="p-2">Sector</th>
                      <th className="p-2 text-right">Price (INR)</th>
                      <th className="p-2 text-right">Day Chg</th>
                      <th className="p-2 text-right">Vol Mult</th>
                      <th className="p-2 text-right">Weight</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-finn-border/50 text-slate-200">
                    {portfolio.stocks.map(s => (
                      <tr key={s.ticker} className="hover:bg-finn-surface/50">
                        <td className="p-2 font-bold text-slate-100">{s.ticker}</td>
                        <td className="p-2 text-slate-400 text-[11px]">{s.sector}</td>
                        <td className="p-2 text-right">₹{s.price.toFixed(1)}</td>
                        <td className={`p-2 text-right ${s.change_pct >= 0 ? 'text-finn-gain' : 'text-finn-loss'}`}>
                          {s.change_pct >= 0 ? '+' : ''}{s.change_pct.toFixed(2)}%
                        </td>
                        <td className="p-2 text-right">
                          <span className={s.volume_multiple >= 2.0 ? 'text-amber-400 font-bold' : 'text-slate-400'}>
                            {s.volume_multiple.toFixed(2)}x
                          </span>
                        </td>
                        <td className="p-2 text-right text-slate-300">{s.portfolio_weight}%</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </div>
          )}
        </div>
      );
    }

    // Mount to DOM
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
