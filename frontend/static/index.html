<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>FINN — Financial Investment Intelligence Agent | ENAM Holdings</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            finn: {
              bg: '#0A0F1A',
              surface: '#111726',
              surfaceHover: '#161F33',
              card: '#141C2E',
              border: '#1E293D',
              borderLight: '#2B3954',
              accent: '#38BDF8',
              accentHover: '#0EA5E9',
              gold: '#F59E0B',
              gain: '#10B981',
              loss: '#F43F5E',
              textPrimary: '#F8FAFC',
              textSecondary: '#94A3B8',
              textMuted: '#64748B'
            }
          },
          fontFamily: {
            mono: ['JetBrains Mono', 'Menlo', 'Consolas', 'monospace'],
            sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'sans-serif']
          }
        }
      }
    }
  </script>

  <!-- React 18 & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel Standalone for JSX compilation -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    /* Clean Linear-inspired scrollbar */
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: #0A0F1A; }
    ::-webkit-scrollbar-thumb { background: #1E293D; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #38BDF8; }
    body {
      background-color: #0A0F1A;
      color: #F8FAFC;
      font-feature-settings: "cv02", "cv03", "cv04", "cv11";
      -webkit-font-smoothing: antialiased;
    }
  </style>
</head>
<body class="bg-finn-bg text-finn-textPrimary min-h-screen font-sans selection:bg-sky-500/20 selection:text-sky-300">
  <div id="root"></div>

  <!-- Main React Application -->
  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    // --- ICONS ---
    const Icon = ({ name, className = "w-4 h-4", ...props }) => {
      switch (name) {
        case 'trending-up':
          return <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" {...props}><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"/></svg>;
        case 'trending-down':
          return <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" {...props}><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M13 17h8m0 0V9m0 8l-8-8-4 4-6-6"/></svg>;
        case 'bell':
          return <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" {...props}><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/></svg>;
        case 'search':
          return <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" {...props}><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>;
        case 'sliders':
          return <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" {...props}><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4"/></svg>;
        case 'home':
          return <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" {...props}><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>;
        case 'file-text':
          return <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" {...props}><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>;
        case 'external-link':
          return <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" {...props}><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/></svg>;
        case 'check':
          return <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" {...props}><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5 13l4 4L19 7"/></svg>;
        case 'chevron-down':
          return <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" {...props}><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 9l-7 7-7-7"/></svg>;
        case 'chevron-up':
          return <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" {...props}><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5 15l7-7 7 7"/></svg>;
        case 'upload':
          return <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" {...props}><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/></svg>;
        case 'info':
          return <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" {...props}><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>;
        case 'alert-triangle':
          return <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24" {...props}><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>;
        default:
          return <div className={className} />;
      }
    };

    // --- API CLIENT ---
    const API = {
      getStatus: () => fetch('/api/status').then(r => r.json()),
      getPortfolio: () => fetch('/api/portfolio').then(r => r.json()),
      getStock: (ticker) => fetch(`/api/stocks/${ticker}`).then(r => r.json()),
      getAnnouncements: (params = {}) => {
        const query = new URLSearchParams(params).toString();
        return fetch(`/api/announcements?${query}`).then(r => r.json());
      },
      getAlerts: () => fetch('/api/alerts').then(r => r.json()),
      acknowledgeAlert: (id) => fetch(`/api/alerts/acknowledge/${id}`, { method: 'POST' }).then(r => r.json()),
      getAlertSettings: () => fetch('/api/alerts/settings').then(r => r.json()),
      updateAlertSettings: (settings) => fetch('/api/alerts/settings', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(settings)
      }).then(r => r.json()),
      getDigest: (windowHours = 24) => fetch(`/api/digest?window_hours=${windowHours}`).then(r => r.json()),
      runResearch: (ticker, query) => fetch('/api/research/query', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ ticker, query })
      }).then(r => r.json()),
      getDocuments: (ticker) => fetch(`/api/research/documents/${ticker}`).then(r => r.json()),
      getPageText: (docId, pageNum) => fetch(`/api/research/document/${docId}/page/${pageNum}`).then(r => r.json())
    };

    // Helpers
    const formatINR = (val) => {
      if (val === undefined || val === null) return '—';
      return '₹' + Number(val).toLocaleString('en-IN', { maximumFractionDigits: 0 });
    };

    const getGreeting = () => {
      const h = new Date().getHours();
      if (h < 12) return 'Good morning';
      if (h < 17) return 'Good afternoon';
      return 'Good evening';
    };

    // --- MAIN APP COMPONENT ---
    function App() {
      const [currentTab, setCurrentTab] = useState('home'); // 'home' | 'alerts' | 'research' | 'settings'
      const [portfolio, setPortfolio] = useState(null);
      const [alerts, setAlerts] = useState([]);
      const [announcements, setAnnouncements] = useState([]);
      const [digest, setDigest] = useState(null);
      const [digestWindow, setDigestWindow] = useState(24);
      const [systemStatus, setSystemStatus] = useState(null);
      const [loading, setLoading] = useState(true);

      // Research State
      const [researchTicker, setResearchTicker] = useState('TCS');
      const [researchQuery, setResearchQuery] = useState('Analyze financial trajectory, guidance vs actuals, and bull vs bear case');
      const [researchResult, setResearchResult] = useState(null);
      const [researchLoading, setResearchLoading] = useState(false);

      // Source Inspection Modal State
      const [sourceModal, setSourceModal] = useState({ open: false, docId: '', pageNum: 1, text: '', title: '' });

      // Settings State
      const [alertSettings, setAlertSettings] = useState({
        price_move_threshold: 3.0,
        volume_mult_threshold: 2.0,
        digest_window_hours: 24,
        monitored_categories: []
      });

      const refreshData = async () => {
        try {
          const [portData, alertData, annData, digData, statData, settData] = await Promise.all([
            API.getPortfolio(),
            API.getAlerts(),
            API.getAnnouncements({ window_hours: digestWindow }),
            API.getDigest(digestWindow),
            API.getStatus(),
            API.getAlertSettings()
          ]);
          setPortfolio(portData);
          setAlerts(alertData);
          setAnnouncements(annData);
          setDigest(digData);
          setSystemStatus(statData);
          setAlertSettings(settData);
        } catch (e) {
          console.error("Data refresh failed", e);
        } finally {
          setLoading(false);
        }
      };

      useEffect(() => {
        refreshData();
      }, [digestWindow]);

      // Initial research load for TCS
      useEffect(() => {
        if (!researchResult && !researchLoading) {
          handleExecuteResearch('TCS', 'Analyze financial trajectory, guidance vs actuals, and bull vs bear case');
        }
      }, []);

      const handleExecuteResearch = async (ticker, query) => {
        setResearchLoading(true);
        setResearchTicker(ticker);
        try {
          const res = await API.runResearch(ticker, query || researchQuery);
          setResearchResult(res);
        } catch (e) {
          console.error("Research failed", e);
        } finally {
          setResearchLoading(false);
        }
      };

      const handleOpenCitation = async (docId, pageNum, title) => {
        try {
          const page = await API.getPageText(docId, pageNum);
          setSourceModal({
            open: true,
            docId,
            pageNum,
            title: title || docId,
            text: page ? page.text : 'Page text not available.'
          });
        } catch (e) {
          setSourceModal({
            open: true,
            docId,
            pageNum,
            title: docId,
            text: 'Failed to retrieve page text.'
          });
        }
      };

      const handleAcknowledgeAlert = async (id) => {
        try {
          await API.acknowledgeAlert(id);
          setAlerts(prev => prev.map(a => a.id === id ? { ...a, acknowledged: true } : a));
        } catch (e) {
          console.error("Acknowledge failed", e);
        }
      };

      const activeAlertsCount = alerts.filter(a => !a.acknowledged).length;

      return (
        <div className="min-h-screen bg-finn-bg flex flex-col">
          {/* HEADER BAR */}
          <header className="border-b border-finn-border bg-finn-surface/90 backdrop-blur sticky top-0 z-40">
            <div className="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
              {/* Brand & Market Date */}
              <div className="flex items-center space-x-3">
                <div className="w-7 h-7 rounded bg-sky-500/10 border border-sky-500/30 flex items-center justify-center font-mono font-bold text-sky-400 text-sm">
                  F
                </div>
                <div>
                  <div className="flex items-center space-x-2">
                    <span className="font-bold text-sm tracking-tight text-white">FINN</span>
                    <span className="text-[11px] text-finn-textMuted hidden sm:inline">Investment Intelligence</span>
                    <span className="text-[10px] font-mono px-1.5 py-0.5 rounded bg-finn-card border border-finn-border text-slate-400">
                      ENAM Holdings
                    </span>
                  </div>
                  <div className="text-[11px] text-finn-textSecondary flex items-center space-x-2">
                    <span>Market close: Oct 31, 2024</span>
                    <span className="text-finn-border">•</span>
                    <span className="text-emerald-400/90 text-[10px] font-mono">Curated Disclosures</span>
                  </div>
                </div>
              </div>

              {/* Navigation Tabs (Desktop & Mobile) */}
              <nav className="flex items-center space-x-1 sm:space-x-1 bg-finn-card/70 p-1 rounded-lg border border-finn-border">
                {[
                  { id: 'home', label: 'Home', icon: 'home' },
                  { id: 'alerts', label: 'Alerts', icon: 'bell', badge: activeAlertsCount },
                  { id: 'research', label: 'Research', icon: 'search' },
                  { id: 'settings', label: 'Settings', icon: 'sliders' }
                ].map(tab => (
                  <button
                    key={tab.id}
                    onClick={() => setCurrentTab(tab.id)}
                    className={`flex items-center space-x-1.5 px-3 py-1.5 rounded-md text-xs font-medium transition-colors relative ${
                      currentTab === tab.id
                        ? 'bg-sky-500/15 text-sky-300 border border-sky-500/30'
                        : 'text-finn-textSecondary hover:text-white hover:bg-finn-surface'
                    }`}
                  >
                    <Icon name={tab.icon} className="w-3.5 h-3.5" />
                    <span>{tab.label}</span>
                    {tab.badge > 0 && (
                      <span className="ml-1 px-1.5 py-0.2 rounded-full text-[9px] font-mono font-bold bg-rose-500/20 text-rose-300 border border-rose-500/30">
                        {tab.badge}
                      </span>
                    )}
                  </button>
                ))}
              </nav>
            </div>
          </header>

          {/* MAIN CONTENT AREA */}
          <main className="flex-1 max-w-6xl w-full mx-auto px-4 py-6">
            {loading ? (
              <div className="py-20 text-center space-y-3">
                <div className="w-6 h-6 border-2 border-sky-400 border-t-transparent rounded-full animate-spin mx-auto"></div>
                <div className="text-xs text-finn-textSecondary font-mono">Loading portfolio data...</div>
              </div>
            ) : (
              <>
                {currentTab === 'home' && (
                  <HomeView
                    portfolio={portfolio}
                    alerts={alerts}
                    digest={digest}
                    digestWindow={digestWindow}
                    setDigestWindow={setDigestWindow}
                    onNavigateToResearch={(ticker) => {
                      setCurrentTab('research');
                      handleExecuteResearch(ticker);
                    }}
                  />
                )}

                {currentTab === 'alerts' && (
                  <AlertsView
                    alerts={alerts}
                    announcements={announcements}
                    alertSettings={alertSettings}
                    setAlertSettings={setAlertSettings}
                    onAcknowledge={handleAcknowledgeAlert}
                    onNavigateToResearch={(ticker) => {
                      setCurrentTab('research');
                      handleExecuteResearch(ticker);
                    }}
                  />
                )}

                {currentTab === 'research' && (
                  <ResearchView
                    ticker={researchTicker}
                    setTicker={setResearchTicker}
                    query={researchQuery}
                    setQuery={setResearchQuery}
                    result={researchResult}
                    loading={researchLoading}
                    onExecute={handleExecuteResearch}
                    onOpenCitation={handleOpenCitation}
                  />
                )}

                {currentTab === 'settings' && (
                  <SettingsView
                    alertSettings={alertSettings}
                    setAlertSettings={setAlertSettings}
                    portfolio={portfolio}
                    systemStatus={systemStatus}
                    onRefresh={refreshData}
                  />
                )}
              </>
            )}
          </main>

          {/* CITATION MODAL */}
          {sourceModal.open && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/75 backdrop-blur-sm animate-fade-in">
              <div className="bg-finn-surface border border-finn-border rounded-xl max-w-2xl w-full max-h-[85vh] flex flex-col shadow-2xl overflow-hidden">
                <div className="p-4 border-b border-finn-border flex items-center justify-between bg-finn-card/50">
                  <div className="flex items-center space-x-2.5">
                    <Icon name="file-text" className="w-4 h-4 text-sky-400" />
                    <div>
                      <h3 className="text-xs font-semibold text-white">{sourceModal.title}</h3>
                      <p className="text-[10px] font-mono text-finn-textSecondary">Verified PyMuPDF Extraction • Page {sourceModal.pageNum}</p>
                    </div>
                  </div>
                  <button
                    onClick={() => setSourceModal(prev => ({ ...prev, open: false }))}
                    className="p-1.5 rounded hover:bg-finn-surface text-finn-textMuted hover:text-white text-xs font-mono"
                  >
                    ✕ Close
                  </button>
                </div>
                <div className="p-4 overflow-y-auto font-mono text-xs text-slate-300 leading-relaxed whitespace-pre-wrap selection:bg-sky-500/30">
                  {sourceModal.text}
                </div>
                <div className="p-3 border-t border-finn-border bg-finn-card/30 flex justify-between items-center text-[10px] font-mono text-finn-textMuted">
                  <span>Document ID: {sourceModal.docId}</span>
                  <span className="text-emerald-400">Primary Evidence Authenticated</span>
                </div>
              </div>
            </div>
          )}

          {/* FOOTER */}
          <footer className="border-t border-finn-border py-4 text-center text-xs text-finn-textMuted font-mono">
            FINN Investment Intelligence Agent • ENAM Holdings AI Engineer Challenge • Historical EOD Data: Oct 31, 2024
          </footer>
        </div>
      );
    }

    // =========================================================================
    // VIEW 1: HOME VIEW
    // =========================================================================
    function HomeView({ portfolio, alerts, digest, digestWindow, setDigestWindow, onNavigateToResearch }) {
      const [expandedAnn, setExpandedAnn] = useState({});

      const toggleExpand = (id) => {
        setExpandedAnn(prev => ({ ...prev, [id]: !prev[id] }));
      };

      const topDevelopments = (digest?.items || []).slice(0, 3);

      return (
        <div className="space-y-6">
          {/* WELCOME SECTION */}
          <div>
            <h1 className="text-xl font-semibold tracking-tight text-white">
              {getGreeting()}, Investment Team
            </h1>
            <p className="text-xs text-finn-textSecondary mt-0.5">
              Here's what's happening with your portfolio today.
            </p>
          </div>

          {/* PORTFOLIO OVERVIEW CARDS (CLEAN FINTECH ROW) */}
          {portfolio && (
            <div className="grid grid-cols-2 md:grid-cols-4 gap-3">
              <div className="bg-finn-card/80 border border-finn-border rounded-xl p-3.5">
                <div className="text-[11px] text-finn-textMuted">Portfolio Value</div>
                <div className="text-lg font-bold font-mono text-white mt-1">
                  {formatINR(portfolio.total_value_inr)}
                </div>
                <div className="text-[10px] text-finn-textSecondary font-mono mt-0.5">
                  ₹{(portfolio.total_value_inr / 100000).toFixed(2)} lakh NAV
                </div>
              </div>

              <div className="bg-finn-card/80 border border-finn-border rounded-xl p-3.5">
                <div className="text-[11px] text-finn-textMuted">Today's P&L</div>
                <div className={`text-lg font-bold font-mono mt-1 ${portfolio.day_change_inr >= 0 ? 'text-emerald-400' : 'text-rose-400'}`}>
                  {portfolio.day_change_inr >= 0 ? '+' : ''}{formatINR(portfolio.day_change_inr)}
                </div>
                <div className="text-[10px] font-mono text-emerald-400 mt-0.5">
                  +{portfolio.day_change_pct}% today
                </div>
              </div>

              <div className="bg-finn-card/80 border border-finn-border rounded-xl p-3.5">
                <div className="text-[11px] text-finn-textMuted">Total Unrealized P&L</div>
                <div className={`text-lg font-bold font-mono mt-1 ${portfolio.total_pnl_inr >= 0 ? 'text-emerald-400' : 'text-rose-400'}`}>
                  {portfolio.total_pnl_inr >= 0 ? '+' : ''}{formatINR(portfolio.total_pnl_inr)}
                </div>
                <div className="text-[10px] text-finn-textSecondary font-mono mt-0.5">
                  Invested: {formatINR(portfolio.total_invested_inr)}
                </div>
              </div>

              <div className="bg-finn-card/80 border border-finn-border rounded-xl p-3.5">
                <div className="text-[11px] text-finn-textMuted">Overall Return</div>
                <div className="text-lg font-bold font-mono text-emerald-400 mt-1">
                  +{portfolio.total_pnl_pct}%
                </div>
                <div className="text-[10px] text-finn-textSecondary font-mono mt-0.5">
                  18 large-cap stocks
                </div>
              </div>
            </div>
          )}

          {/* IMPORTANT DEVELOPMENTS (TOP 3) */}
          <div className="bg-finn-card/80 border border-finn-border rounded-xl p-4 space-y-3">
            <div className="flex items-center justify-between border-b border-finn-border pb-2.5">
              <div>
                <h2 className="text-xs font-semibold uppercase tracking-wider text-white">Important developments</h2>
                <p className="text-[11px] text-finn-textMuted">Highest priority corporate disclosures affecting your portfolio</p>
              </div>
              <span className="text-[10px] font-mono text-sky-400 px-2 py-0.5 rounded bg-sky-500/10 border border-sky-500/20">
                Actionable
              </span>
            </div>

            <div className="grid grid-cols-1 md:grid-cols-3 gap-3">
              {topDevelopments.map((item, idx) => (
                <div key={idx} className="bg-finn-surface border border-finn-border rounded-lg p-3 flex flex-col justify-between hover:border-sky-500/30 transition-colors">
                  <div>
                    <div className="flex items-center justify-between mb-1.5">
                      <span className="text-xs font-bold font-mono text-white">{item.ticker}</span>
                      <span className={`text-[9px] font-mono px-1.5 py-0.2 rounded font-semibold ${
                        item.priority === 'HIGH' ? 'bg-rose-500/15 text-rose-300 border border-rose-500/20' : 'bg-amber-500/15 text-amber-300 border border-amber-500/20'
                      }`}>
                        {item.category.replace('_', ' ')}
                      </span>
                    </div>
                    <div className="text-xs font-medium text-slate-200 line-clamp-2">{item.headline}</div>
                    <div className="text-[11px] text-finn-textSecondary mt-1.5 line-clamp-3 leading-relaxed">
                      {item.why_investor_should_care}
                    </div>
                  </div>
                  <div className="mt-3 pt-2 border-t border-finn-border/60 flex items-center justify-between">
                    <span className="text-[10px] font-mono text-finn-textMuted">{item.original_filing_date || 'Oct 2024'}</span>
                    <button
                      onClick={() => onNavigateToResearch(item.ticker)}

    function AlertsView({ alerts, announcements, alertSettings, setAlertSettings, onAcknowledge, onNavigateToResearch }) {
      const [filterType, setFilterType] = useState('ALL');
      const [thresholdPrice, setThresholdPrice] = useState(alertSettings?.price_move_threshold || 3.0);
      const [thresholdVol, setThresholdVol] = useState(alertSettings?.volume_mult_threshold || 2.0);
      const [savedNotice, setSavedNotice] = useState(false);

      const handleSaveSettings = async () => {
        try {
          await API.updateAlertSettings({
            ...alertSettings,
            price_move_threshold: parseFloat(thresholdPrice),
            volume_mult_threshold: parseFloat(thresholdVol)
          });
          setSavedNotice(true);
          setTimeout(() => setSavedNotice(false), 2500);
        } catch (e) {
          console.error("Failed to update thresholds", e);
        }
      };

      const filteredAlerts = alerts.filter(a => {
        if (filterType === 'ALL') return true;
        if (filterType === 'ACTIVE') return !a.acknowledged;
        if (filterType === 'PRICE') return a.alert_type === 'PRICE_MOVE';
        if (filterType === 'VOLUME') return a.alert_type === 'UNUSUAL_VOLUME';
        return true;
      });

      return (
        <div className="space-y-6">
          {/* HEADER */}
          <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
            <div>
              <h1 className="text-xl font-semibold tracking-tight text-white">Alerts & Notifications</h1>
              <p className="text-xs text-finn-textSecondary mt-0.5">
                Monitored price movements, volume spikes, and corporate announcements
              </p>
            </div>

            {/* Filter pills */}
            <div className="flex items-center space-x-1 bg-finn-card p-1 rounded-lg border border-finn-border">
              {['ALL', 'ACTIVE', 'PRICE', 'VOLUME'].map(f => (
                <button
                  key={f}
                  onClick={() => setFilterType(f)}
                  className={`px-3 py-1 rounded text-xs font-medium transition-colors ${
                    filterType === f ? 'bg-sky-500/20 text-sky-300 font-bold' : 'text-finn-textSecondary hover:text-white'
                  }`}
                >
                  {f === 'ALL' ? 'All Alerts' : f === 'ACTIVE' ? 'Unacknowledged' : f === 'PRICE' ? 'Price' : 'Volume'}
                </button>
              ))}
            </div>
          </div>

          {/* TWO COLUMN GRID: ACTIVE ALERTS & THRESHOLD CONTROLS */}
          <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
            {/* ALERTS FEED (8 cols) */}
            <div className="lg:col-span-8 space-y-3">
              {filteredAlerts.length === 0 ? (
                <div className="bg-finn-card border border-finn-border rounded-xl p-8 text-center text-xs text-finn-textMuted">
                  No alerts matching the selected filter.
                </div>
              ) : (
                filteredAlerts.map(alert => (
                  <div
                    key={alert.id}
                    className={`bg-finn-card border rounded-xl p-4 transition-all flex flex-col sm:flex-row sm:items-center justify-between gap-3 ${
                      alert.acknowledged ? 'border-finn-border/40 opacity-60' : 'border-finn-border hover:border-sky-500/30'
                    }`}
                  >
                    <div className="space-y-1">
                      <div className="flex items-center space-x-2">
                        <span className="font-mono font-bold text-white text-xs">{alert.ticker}</span>
                        <span className={`text-[9px] font-mono px-1.5 py-0.2 rounded font-semibold ${
                          alert.alert_type === 'PRICE_MOVE' ? 'bg-rose-500/15 text-rose-300 border border-rose-500/20' :
                          alert.alert_type === 'UNUSUAL_VOLUME' ? 'bg-amber-500/15 text-amber-300 border border-amber-500/20' :
                          'bg-sky-500/15 text-sky-300 border border-sky-500/20'
                        }`}>
                          {alert.alert_type.replace('_', ' ')}
                        </span>
                        {alert.acknowledged && (
                          <span className="text-[9px] font-mono text-finn-textMuted">✓ Acknowledged</span>
                        )}
                      </div>
                      <div className="text-xs font-semibold text-slate-100">{alert.title}</div>
                      <div className="text-[11px] text-finn-textSecondary leading-relaxed">{alert.description}</div>
                    </div>

                    <div className="flex items-center space-x-2 shrink-0">
                      <button
                        onClick={() => onNavigateToResearch(alert.ticker)}
                        className="px-2.5 py-1 rounded bg-finn-surface hover:bg-finn-surfaceHover border border-finn-border text-xs text-sky-400 font-medium transition-colors"
                      >
                        Research
                      </button>
                      {!alert.acknowledged && (
                        <button
                          onClick={() => onAcknowledge(alert.id)}
                          className="px-2.5 py-1 rounded bg-finn-surface hover:bg-finn-surfaceHover border border-finn-border text-xs text-slate-300 hover:text-white transition-colors"
                        >
                          Dismiss
                        </button>
                      )}
                    </div>
                  </div>
                ))
              )}
            </div>

            {/* THRESHOLD CONTROLS (4 cols) */}
            <div className="lg:col-span-4 bg-finn-card border border-finn-border rounded-xl p-4 space-y-4 h-fit">
              <div className="border-b border-finn-border pb-2.5">
                <h2 className="text-xs font-semibold uppercase tracking-wider text-white">Alert Thresholds</h2>

              <div className="space-y-3">

                    <span className="text-white font-bold">±{thresholdPrice}%</span>
                  </div>
                  <input
                    type="range"
                    min="1.0"
                    max="10.0"
                    step="0.5"
                    value={thresholdPrice}
                    onChange={(e) => setThresholdPrice(e.target.value)}
                    className="w-full accent-sky-400 cursor-pointer"
                  />
                  <div className="flex justify-between text-[10px] font-mono text-finn-textMuted mt-0.5">
                    <span>1.0%</span>
                    <span>10.0%</span>
                  </div>

                <div>
                  <div className="flex justify-between text-xs font-mono mb-1">
                    <span className="text-finn-textSecondary">Volume Spike Trigger</span>
                    <span className="text-white font-bold">{thresholdVol}x 20d MA</span>

                  <input
                    type="range"

                    max="5.0"
                    step="0.1"
                    value={thresholdVol}
                    onChange={(e) => setThresholdVol(e.target.value)}
                    className="w-full accent-sky-400 cursor-pointer"
                  />
                  <div className="flex justify-between text-[10px] font-mono text-finn-textMuted mt-0.5">
                    <span>1.2x</span>
                    <span>5.0x</span>
                  </div>
                </div>

                <button
                  onClick={handleSaveSettings}
                  className="w-full py-2 rounded-lg bg-sky-500/15 hover:bg-sky-500/25 border border-sky-500/30 text-sky-300 font-medium text-xs transition-colors flex items-center justify-center space-x-1.5"
                >
                  <Icon name="check" className="w-3.5 h-3.5" />
                  <span>Save Thresholds</span>
                </button>

                {savedNotice && (
                  <div className="text-[11px] font-mono text-emerald-400 text-center">
                    ✓ Thresholds updated successfully
                  </div>
                )}
              </div>
            </div>
          </div>
        </div>
      );
    }

    function ResearchView({ ticker, setTicker, query, setQuery, result, loading, onExecute, onOpenCitation }) {
      const fileInputRef = useRef(null);
      const [uploadStatus, setUploadStatus] = useState('');
      
      // Collapsible section state (all expanded by default for full visibility)
      const [collapsedSections, setCollapsedSections] = useState({});

      const toggleSection = (secKey) => {
        setCollapsedSections(prev => ({ ...prev, [secKey]: !prev[secKey] }));
      };

      const expandAll = () => setCollapsedSections({});
      const collapseAll = () => setCollapsedSections({
        exec: true, biz: true, fin: true, traj: true, bs: true, cash: true, narr: true, bb: true, cites: true
      });

      const presetQueries = [
        "Analyze financial trajectory, guidance vs actuals, and bull vs bear case",
        "Compare management guidance with actual performance",
        "What is the balance sheet health, debt-to-equity and cash conversion?",
        "What are the major bull and bear arguments based on primary filings?"
      ];

      const handleFileUpload = async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        setUploadStatus('Indexing PDF via PyMuPDF...');
        try {
          const resp = await fetch(`/api/research/upload?filename=${encodeURIComponent(file.name)}&ticker=${encodeURIComponent(ticker)}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/pdf' },
            body: file
          }).then(r => r.json());
          setUploadStatus(`Indexed: ${resp.doc_id}`);
          setTimeout(() => setUploadStatus(''), 4000);
          onExecute(ticker, query);
        } catch (err) {
          setUploadStatus('Upload failed');
          setTimeout(() => setUploadStatus(''), 3000);
        }
      };

      return (
        <div className="space-y-6">
          {/* SEARCH & QUERY INPUT CARD */}
          <div className="bg-finn-card border border-finn-border rounded-xl p-4 space-y-3">

              </div>
              <div className="flex items-center space-x-2">
                <input
                  type="file"
                  ref={fileInputRef}
                  accept=".pdf"
                  onChange={handleFileUpload}
                  className="hidden"
                />
                <button
                  onClick={() => fileInputRef.current?.click()}
                  className="px-2.5 py-1.5 rounded-lg bg-finn-surface hover:bg-finn-surfaceHover border border-finn-border text-xs text-sky-400 font-medium flex items-center space-x-1.5 transition-colors"

                <button
